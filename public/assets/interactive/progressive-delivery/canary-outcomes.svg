<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 440" role="img" aria-labelledby="title desc"><title id="title">HTTP y resultado del precio en el canary</title><desc id="desc">Control: 180 respuestas HTTP 200 y 180 precios correctos. Candidato: 20 respuestas HTTP 200 y ningún precio correcto. Escala común de cero a cien por ciento en cada grupo.</desc><rect width="380" height="440" rx="12" fill="#0f172a"/><g font-family="system-ui,sans-serif" fill="#f8fafc"><text x="18" y="30" font-size="18" font-weight="700">HTTP 200 no valida el precio</text><text x="18" y="70" font-size="17" font-weight="700">Control: 180 respuestas</text><text x="18" y="94" font-size="14">HTTP 200: 180/180</text><rect x="18" y="104" width="344" height="18" fill="#1e293b" stroke="#64748b"/><rect x="18" y="104" width="344.00" height="18" fill="#38bdf8"/><text x="18" y="154" font-size="14">Precio correcto: 180/180</text><rect x="18" y="164" width="344" height="18" fill="#1e293b" stroke="#64748b"/><rect x="18" y="164" width="344.00" height="18" fill="#34d399"/><text x="18" y="234" font-size="17" font-weight="700">Candidato: 20 respuestas</text><text x="18" y="258" font-size="14">HTTP 200: 20/20</text><rect x="18" y="268" width="344" height="18" fill="#1e293b" stroke="#64748b"/><rect x="18" y="268" width="344.00" height="18" fill="#38bdf8"/><text x="18" y="318" font-size="14">Precio correcto: 0/20</text><rect x="18" y="328" width="344" height="18" fill="#1e293b" stroke="#64748b"/><rect x="18" y="328" width="0.00" height="18" fill="#34d399"/><text x="18" y="410" font-size="13">Muestra sintética. Escala de 0 a 100 %.</text></g></svg>
