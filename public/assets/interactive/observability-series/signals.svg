<svg xmlns="http://www.w3.org/2000/svg" width="380" height="420" viewBox="0 0 380 420" role="img" aria-labelledby="title desc"><title id="title">Spans exportados por escenario</title><desc id="desc">Los cuatro escenarios muestreados exportan cinco spans; unsampled no exporta ninguno. Las cinco operaciones se incluyen en las métricas.</desc><rect width="380" height="420" fill="#111827"/><g font-family="sans-serif" font-size="14"><text x="18" y="30" fill="#f8fafc" font-size="17">Cinco clics reales desde React</text><text x="18" y="75" fill="#e5e7eb">ok</text><rect x="115" y="60" width="170" height="22" fill="#60a5fa"/><text x="292" y="75" fill="#e5e7eb">5 spans</text><text x="115" y="95" fill="#cbd5e1">1 traza exportada · 1 job medido</text><text x="18" y="133" fill="#e5e7eb">fail</text><rect x="115" y="118" width="170" height="22" fill="#60a5fa"/><text x="292" y="133" fill="#e5e7eb">5 spans</text><text x="115" y="153" fill="#cbd5e1">1 traza exportada · 1 job medido</text><text x="18" y="191" fill="#e5e7eb">broken</text><rect x="115" y="176" width="170" height="22" fill="#60a5fa"/><text x="292" y="191" fill="#e5e7eb">5 spans</text><text x="115" y="211" fill="#cbd5e1">2 trazas exportadas · 1 job medido</text><text x="18" y="249" fill="#e5e7eb">link</text><rect x="115" y="234" width="170" height="22" fill="#60a5fa"/><text x="292" y="249" fill="#e5e7eb">5 spans</text><text x="115" y="269" fill="#cbd5e1">2 trazas exportadas · 1 job medido</text><text x="18" y="307" fill="#e5e7eb">unsampled</text><rect x="115" y="292" width="0" height="22" fill="#60a5fa"/><text x="122" y="307" fill="#e5e7eb">0 spans</text><text x="115" y="327" fill="#cbd5e1">0 trazas exportadas · 1 job medido</text><text x="18" y="390" fill="#cbd5e1">Fixture local · no mide capacidad</text></g></svg>
