<svg xmlns="http://www.w3.org/2000/svg" width="380" height="380" viewBox="0 0 380 380" role="img" aria-labelledby="title desc"><title id="title">Completados y pendientes observados</title><desc id="desc">El ejercicio observa dos completos y tres pendientes durante el fallo; cinco completos después de drenar y siete tras probar trabajo nuevo.</desc><rect width="380" height="380" fill="#111827"/><g font-family="sans-serif" font-size="14"><text x="16" y="28" fill="#f8fafc" font-size="17">Fixture real · incidente sintético</text><text x="16" y="50" fill="#cbd5e1" font-size="12">Verde: completados · ámbar: pendientes</text><text x="16" y="78" fill="#e5e7eb">Baseline</text><rect x="142" y="63" width="40" height="17" fill="#34d399"/><text x="188" y="78" fill="#e5e7eb">2</text><text x="142" y="99" fill="#fbbf24">0 pendientes</text><text x="16" y="144" fill="#e5e7eb">Sin progreso</text><rect x="142" y="129" width="40" height="17" fill="#34d399"/><text x="188" y="144" fill="#e5e7eb">2</text><text x="142" y="165" fill="#fbbf24">3 pendientes</text><text x="16" y="210" fill="#e5e7eb">Drenado</text><rect x="142" y="195" width="100" height="17" fill="#34d399"/><text x="248" y="210" fill="#e5e7eb">5</text><text x="142" y="231" fill="#fbbf24">0 pendientes</text><text x="16" y="276" fill="#e5e7eb">Trabajo nuevo</text><rect x="142" y="261" width="140" height="17" fill="#34d399"/><text x="288" y="276" fill="#e5e7eb">7</text><text x="142" y="297" fill="#fbbf24">0 pendientes</text><text x="16" y="355" fill="#cbd5e1">Recuentos, no tiempos de respuesta humanos</text></g></svg>
