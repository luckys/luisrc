<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 330" role="img" aria-labelledby="title desc"><title id="title">Tamaños locales de las images</title><desc id="desc">docker image inspect: build 797659553 bytes; runtime 344513982 bytes. No es descarga comprimida ni memoria del proceso.</desc><rect width="380" height="330" rx="12" fill="#0f172a"/><g font-family="system-ui,sans-serif" fill="#f8fafc"><text x="20" y="32" font-size="18" font-weight="700">Build y runtime, escala común</text><text x="20" y="80" font-size="16">Stage build: 760,7 MiB</text><rect x="20" y="94" width="340.00" height="36" rx="4" fill="#a78bfa"/><text x="20" y="172" font-size="16">Runtime: 328,6 MiB</text><rect x="20" y="186" width="146.85" height="36" rx="4" fill="#38bdf8"/><text x="20" y="274" font-size="14">Tamaño informado por image inspect.</text><text x="20" y="298" font-size="14">No representa RAM o descarga de red.</text></g></svg>
