<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 440" role="img" aria-label="Descomposición del error del conjunto finito de regresores. Bias cuadrado más variance coincide con riesgo contra señal. No es un experimento de redes neuronales."><rect width="380" height="440" rx="8" fill="#0f172a"/><g font-family="system-ui" font-size="14" fill="#e2e8f0"><text x="14" y="24">Error contra la señal, sin ruido nuevo</text><text x="14" y="47">Escala lineal común; 32 ajustes por grado</text><text x="14" y="85">Grado 1: riesgo 0.4578</text><rect data-degree="1" data-part="bias" x="14" y="101" width="6.238" height="20" fill="#38bdf8"/><rect data-degree="1" data-part="variance" x="20.23793737696942" y="101" width="0.521" height="20" fill="#fbbf24"/><text x="14" y="175">Grado 5: riesgo 0.3404</text><rect data-degree="5" data-part="bias" x="14" y="191" width="1.632" height="20" fill="#38bdf8"/><rect data-degree="5" data-part="variance" x="15.631891212437464" y="191" width="3.395" height="20" fill="#fbbf24"/><rect x="8" y="155" width="350" height="62" rx="4" fill="none" stroke="#f8fafc"/><text x="14" y="265">Grado 15: riesgo 22.3505</text><rect data-degree="15" data-part="bias" x="14" y="281" width="3.957" height="20" fill="#38bdf8"/><rect data-degree="15" data-part="variance" x="17.95702436380961" y="281" width="326.043" height="20" fill="#fbbf24"/><text x="14" y="375" fill="#38bdf8">Azul: bias² del conjunto finito</text><text x="14" y="400" fill="#fbbf24">Amarillo: variance, divisor 32</text></g></svg>
