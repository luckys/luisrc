e;font-size:16px"><tspan x="177.5" dy="0">Fixture HTTP en otro proceso</tspan><tspan x="177.5" dy="18.5">Solo loopback / un request por iteración</tspan></text></g><g class="Y29tcGFyZQ=="><g class="shape" ><rect x="27" y="620" width="300" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="177" y="658.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="177" dy="0">Separar enviado, completado y útil</tspan><tspan x="177" dy="18.5">Una iteración perdida no recibió 503</tspan></text></g><g class="KGNsb3NlZCAtJmd0OyBvcGVuKVswXQ=="><marker id="mk-d2-484305341-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 177.5 96 L 177.5 160" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-484305341-3488378134)" mask="url(#d2-484305341)" /></g><g class="KG9wZW4gLSZndDsgc2xvdHMpWzBd"><path d="M 177.5 248 L 177.5 312" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-484305341-3488378134)" mask="url(#d2-484305341)" /></g><g class="KHNsb3RzIC0mZ3Q7IHNlcnZlcilbMF0="><path d="M 177.5 400 L 177.5 464" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-484305341-3488378134)" mask="url(#d2-484305341)" /></g><g class="KHNlcnZlciAtJmd0OyBjb21wYXJlKVswXQ=="><path d="M 177.5 552 L 177.5 616" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-484305341-3488378134)" mask="url(#d2-484305341)" /></g><mask id="d2-484305341" maskUnits="userSpaceOnUse" x="-5" y="-5" width="365" height="724">
