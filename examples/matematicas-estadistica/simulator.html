<!doctype html>
<html lang="es">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Learning rate: laboratorio local</title>
  <style>
    :root {
      color-scheme: dark;
      font: 100%/1.6 system-ui;
      background: #111827;
      color: #f8fafc;
    }
    body {
      max-width: 55rem;
      margin: 2rem auto;
      padding: 1rem;
    }
    form {
      display: grid;
      gap: 1rem;
    }
    input,
    select {
      font: inherit;
      max-width: 100%;
    }
    label {
      display: grid;
    }
    :focus-visible {
      outline: 3px solid #facc15;
    }
    svg {
      width: 100%;
      height: auto;
      border: 1px solid #64748b;
    }
    output {
      display: block;
      overflow-wrap: anywhere;
      margin: 1rem 0;
    }
  </style>
  <main>
    <h1>Cambiar el learning rate cambia la trayectoria</h1>
    <p>
      Modelo unidimensional. La curva muestra pérdida frente a paso, no una garantía de
      convergencia.
    </p>
    <form>
      <label
        >Función<select name="kind">
          <option value="quadratic">x²</option>
          <option value="double">(x²−1)²</option>
        </select></label
      >
      <label
        >Punto inicial<input
          name="start"
          type="range"
          min="-2"
          max="2"
          step="0.1"
          value="2"
      /></label>
      <label
        >Learning rate<input
          name="rate"
          type="range"
          min="0.01"
          max="1.1"
          step="0.01"
          value="0.1"
      /></label>
    </form>
    <output aria-live="polite"></output>
    <svg
      viewBox="0 0 600 310"
      role="img"
      aria-label="Pérdida por paso, con escala vertical adaptativa"
    >
      <text x="20" y="18" fill="#cbd5e1">Pérdida (escala adaptativa)</text>
      <text x="500" y="305" fill="#cbd5e1">Paso 0–30</text>
      <polyline fill="none" stroke="#38bdf8" stroke-width="3" />
    </svg>
    <p>
      Consulta los valores numéricos: al divergir, la escala cambia. Un punto con
      gradiente cero no tiene por qué ser un mínimo.
    </p>
  </main>
  <script type="module" src="./simulator.mjs"></script>
</html>
