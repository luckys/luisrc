name: luisrc-database-series
services:
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: series_lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: public-local-lab-only
    volumes:
      - ./sql:/lab/sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lab -d series_lab']
      interval: 1s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8-alpine@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb
    healthcheck:
      test: ['CMD', 'redis-cli', 'PING']
      interval: 1s
      timeout: 3s
      retries: 30
